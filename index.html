<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMELLI ライブ限定カタログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1FB; --ink:#2A2433; --ink-soft:#5F566C;
    --accent:#8E75B8; --deep:#5E4A87; --line:#E4DCF0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Zen Kaku Gothic New", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  main{
    flex:1; width:100%; max-width:560px; margin:0 auto;
    padding:56px 20px 40px; text-align:center;
  }
  .eyebrow{ font-size:12px; letter-spacing:.2em; color:var(--accent); font-weight:700; }
  h1{
    font-family:"Shippori Mincho", serif; font-size:30px; font-weight:800;
    letter-spacing:.06em; margin:14px 0 0;
  }
  .box{
    margin:34px auto 0; padding:28px 20px;
    background:#FDFBFF; border:1px solid var(--line); border-radius:6px;
  }
  .duo{ display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:0 auto 16px; }
  .duo img{ display:block; height:auto; max-width:48%; }
  .box .big{
    font-size:19px; font-weight:700; line-height:1.7; margin:0;
  }
  .box p{ font-size:15px; line-height:2; color:var(--ink-soft); margin:16px 0 0; }
  .ph{ display:inline-block; }
  .links{ display:flex; flex-direction:column; gap:12px; margin-top:30px; }
  .btn{
    display:block; padding:16px 12px; border-radius:999px; text-decoration:none;
    font-size:16px; font-weight:700; letter-spacing:.04em;
  }
  .btn-main{ background:var(--deep); color:#fff; }
  .btn-sub{ background:#FDFBFF; color:var(--deep); border:1.5px solid var(--accent); }
  .btn:active{ opacity:.7; }
  footer{ text-align:center; padding:24px 20px 40px; font-size:12px; color:var(--ink-soft); line-height:1.8; }
  .fmark{ font-family:"Shippori Mincho", serif; font-weight:800; letter-spacing:.15em; font-size:14px; color:var(--accent); margin-bottom:4px; }
  .duo img{width:105px}
</style>
</head>
