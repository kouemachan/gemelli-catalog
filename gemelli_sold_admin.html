<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMELLI SOLD切替(社内用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6F1FB; --ink:#2A2433; --ink-soft:#4F4759;
    --gold:#8E75B8; --gold-light:#CFC2E3; --rosewood:#5E4A87; --line:#E4DCF0;
    --green:#3E7A4E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ivory); color:var(--ink); font-family:"Zen Kaku Gothic New", sans-serif; }
  header{ padding:20px 16px 14px; text-align:center; border-bottom:1px solid var(--line); }
  h1{ font-family:"Shippori Mincho", serif; font-size:20px; margin:0 0 4px; }
  .warn{ font-size:14px; color:var(--rosewood); font-weight:700; }
  .status{ text-align:center; font-size:14px; color:var(--ink-soft); padding:10px; min-height:18px; }
  main{ max-width:640px; margin:0 auto; padding:8px 14px 60px; }
  .row{
    display:flex; align-items:center; gap:10px;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .row.sold{ background:#ECE6F3; }
  .rcode{ font-family:"Shippori Mincho", serif; font-weight:800; font-size:19px; width:54px; flex:0 0 54px; }
  .rname{ flex:1; font-size:15px; color:var(--ink) !important; color:var(--ink-soft); line-height:1.4; }
  .switch{
    position:relative; flex:0 0 56px; width:56px; height:30px;
    background:#C9C2D3; border-radius:999px; cursor:pointer; transition:background .15s ease;
  }
  .switch.on{ background:var(--green); }
  .switch .knob{
    position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; transition:left .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch.on .knob{ left:29px; }
  .rin{ font-size:13px; color:#7A7186; }
  .label{ flex:0 0 58px; text-align:center; font-size:14px; font-weight:700; color:var(--ink-soft); }
  .label.on{ color:var(--green); }
  #configBox{ max-width:640px; margin:14px auto; padding:12px 16px; background:#FFFFFF; border:1px solid var(--gold-light); border-radius:6px; }
  #configBox label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px; }
  #configBox input{ width:100%; padding:8px; font-size:12px; border:1px solid var(--line); border-radius:4px; }
</style>
</head>
<body>

<header>
  <h1>GEMELLI SOLD OUT 切替(10/6ライブ)</h1>
  <div class="warn">社内・営業用ページです。お客様には共有しないでください</div>
</header>

<div id="configBox" style="display:none;">
  <label>Apps Script URL(初回のみ入力・自動保存されます)</label>
  <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
</div>

<div class="status" id="statusMsg">読み込み中...</div>

<main id="list"></main>

<script>
const ITEMS = [{"code": "R-1", "name": "Pt900/K18 CGLソ FVOY SI1 ペアシェイプリング  (社内:42603962)"}, {"code": "R-2", "name": "Pt900/K18 CGLソ FIOY SI1 ペアシェイプリング  (社内:42603963)"}, {"code": "R-3", "name": "Pt900/K18 CGLソ FIOY SI1 ペアシェイプリング  (社内:42603964)"}, {"code": "R-4", "name": "Pt900/K18 CGLソ FIOY I1 クッションリング  (社内:42603965)"}, {"code": "R-5", "name": "Pt900/K18 CGLソ FVOY SI1 クッションリング  (社内:42603966)"}, {"code": "R-6", "name": "Pt900/K18 CGLソ FIOY VS1 クッションリング  (社内:42603967)"}, {"code": "R-7", "name": "Pt900/K18PG CGLソ FIPP SI2/FPP I1 リング  (社内:42603955)"}, {"code": "R-8", "name": "K18WG CGLソ H SI2 ハートシェイプリング  (社内:42603958)"}, {"code": "R-9", "name": "Pt900/K18 CGLソ FDY SI2-I1 フラワーリング  (社内:42603956)"}, {"code": "N-1", "name": "K18 チェーンネックレス  (社内:KZYG-344775-001)"}, {"code": "N-2", "name": "K18 チェーンネックレス  (社内:KZYG-344957-003)"}, {"code": "BL-1", "name": "K18 チェーンブレスレット  (社内:KZYH-344753-004)"}, {"code": "BL-2", "name": "Pt900 チェーンブレスレット  (社内:TZYH-343588-001)"}, {"code": "BL-3", "name": "K18 チェーンブレスレット  (社内:KZYH-344771)"}, {"code": "BL-4", "name": "Pt900 チェーンブレスレット  (社内:—)"}, {"code": "BL-5", "name": "K18 チェーンブレスレット  (社内:KZYH-344378-002)"}, {"code": "BL-6", "name": "K18 チェーンブレスレット  (社内:KZYH-343874-001)"}];
let APPS_SCRIPT_URL = localStorage.getItem("gemelli_admin_gas_url") || "https://script.google.com/macros/s/AKfycbxjxn_d-_nPpJ0cmAW1Wr7_wfQyVOUiOHQPyHwTnPI7f9PdjpmtXrIBHsx2Sbgva00n/exec";

const listEl = document.getElementById("list");
const statusEl = document.getElementById("statusMsg");
const configBox = document.getElementById("configBox");
const urlInput = document.getElementById("urlInput");

if(!APPS_SCRIPT_URL){
  configBox.style.display = "block";
}
urlInput.value = APPS_SCRIPT_URL;
urlInput.addEventListener("change", function(){
  APPS_SCRIPT_URL = urlInput.value.trim();
  localStorage.setItem("gemelli_admin_gas_url", APPS_SCRIPT_URL);
  loadStatus();
});

function renderRows(soldMap){
  listEl.innerHTML = "";
  ITEMS.forEach(function(item){
    const isSold = !!soldMap[item.code];
    const row = document.createElement("div");
    row.className = "row" + (isSold ? " sold" : "");
    row.innerHTML =
      '<div class="rcode">' + item.code + '</div>' +
      '<div class="rname">' + item.name.replace(/\s*\(社内:([^)]*)\)\s*$/, '<br><span class="rin">社内 $1</span>') + '</div>' +
      '<div class="label' + (isSold ? ' on' : '') + '">' + (isSold ? "SOLD" : "在庫あり") + '</div>' +
      '<div class="switch' + (isSold ? ' on' : '') + '" data-code="' + item.code + '"><div class="knob"></div></div>';
    listEl.appendChild(row);
  });

  listEl.querySelectorAll(".switch").forEach(function(sw){
    sw.addEventListener("click", function(){
      const code = sw.dataset.code;
      const turningOn = !sw.classList.contains("on");
      setSold(code, turningOn, sw);
    });
  });
}

function loadStatus(){
  if(!APPS_SCRIPT_URL){
    statusEl.textContent = "上のURL欄にApps ScriptのURLを入力してください";
    renderRows({});
    return;
  }
  statusEl.textContent = "読み込み中...";
  fetch(APPS_SCRIPT_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){
      const soldMap = {};
      (data.items || []).forEach(function(it){ soldMap[it.code] = it.sold; });
      renderRows(soldMap);
      statusEl.textContent = "最新の状態を取得しました";
    })
    .catch(function(){
      statusEl.textContent = "読み込みに失敗しました(URLを確認してください)";
      renderRows({});
    });
}

function setSold(code, sold, swEl){
  statusEl.textContent = "更新中...";
  swEl.classList.toggle("on", sold);
  swEl.closest(".row").classList.toggle("sold", sold);
  const labelEl = swEl.parentElement.querySelector(".label");
  labelEl.textContent = sold ? "SOLD" : "在庫あり";
  labelEl.classList.toggle("on", sold);

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain"},
    body: JSON.stringify({ action:"setSold", code: code, sold: sold })
  })
    .then(function(r){ return r.json(); })
    .then(function(res){
      statusEl.textContent = res.ok ? "更新しました" : "この品番が見つかりませんでした(スプレッドシート要確認)";
    })
    .catch(function(){
      statusEl.textContent = "更新に失敗しました(通信エラー)";
    });
}

loadStatus();
</script>

</body>
</html>
